<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sorteio iPhone 15 Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .iphone {
      width: 100%;
      max-width: 280px;
      height: 280px;
      object-fit: contain;
      margin: 10px auto 20px;
      display: block;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .descricao {
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .info {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      line-height: 1.8;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 16px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .botao:hover {
      background: #333;
    }

    .aviso {
      font-size: 12px;
      color: #777;
      margin-top: 20px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 30px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    SORTEIO LZ
  </header>

  <main class="container">

    <div class="card">

      <!-- Depois vamos colocar a foto real do iPhone aqui -->
      <div class="iphone">
        📱
      </div>

      <h1>iPhone 15 Pro</h1>

      <p class="descricao">
        Participe do nosso sorteio e concorra a um iPhone 15 Pro.
      </p>

      <div class="info">
        <strong>🎁 Prêmio:</strong> iPhone 15 Pro<br>
        <strong>📅 Data:</strong> Em breve<br>
        <strong>👥 Participantes:</strong> 0
      </div>

      <a href="#" class="botao">
        PARTICIPAR
      </a>

      <p class="aviso">
        Consulte o regulamento do sorteio antes de participar.
      </p>

    </div>

  </main>

  <footer>
    © 2026 Sorteio LZ
  </footer>

</body>
</html>
